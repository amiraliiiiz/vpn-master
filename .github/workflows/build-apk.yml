name: Build VPN Master APK

# ساخت APK امضاشده در فضای ابری گیت‌هاب.
# اجرا: تب Actions → Build VPN Master APK → Run workflow
#
# نکتهٔ مهم (نسخهٔ ۲): جاوا باید **قبل** از Android SDK نصب شود، چون sdkmanager
# به جاوا نیاز دارد؛ و اگر اکشن رسمی SDK به هر دلیلی کار نکند، از SDK
# از پیش نصب‌شدهٔ رانر گیت‌هاب استفاده می‌کنیم تا بیلد متوقف نشود.

on:
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: "ref سورس sing-box برای ساخت هستهٔ libbox (testing / stable / v1.14.4)"
        required: false
        default: "testing"
  push:
    branches: ["main", "master"]

env:
  GO_VERSION: "1.26.10"
  SING_BOX_REF: ${{ github.event.inputs.sing_box_ref || 'testing' }}

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      # ۱) سورس اپ. نام پوشه عمداً «sing-box-for-android» است، چون ابزار ساخت
      #    libbox خروجی AAR را خودش در ../sing-box-for-android/app/libs کپی می‌کند.
      - name: Checkout VPN Master
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Prepare libs dir
        run: mkdir -p sing-box-for-android/app/libs

      # ۲) جاوا اول از همه — ابزارهای SDK و ساخت هسته به آن نیاز دارند
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ۳) Android SDK — اگر این اکشن مشکل داشت، بیلد ادامه می‌دهد
      - name: Set up Android SDK
        id: setup-sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      # ۴) Go برای کامپایل هستهٔ VPN
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      # ۵) تعیین مسیرهای SDK/NDK + تضمین وجود فایل لایسنس
      #    (ابزار ساخت libbox نیاز دارد $ANDROID_HOME/licenses/android-sdk-license موجود باشد)
      - name: Resolve Android SDK & NDK paths
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          mkdir -p "$SDK/licenses"
          if [ ! -f "$SDK/licenses/android-sdk-license" ]; then
            printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
              > "$SDK/licenses/android-sdk-license"
          fi
          echo "SDK=$SDK"
          ls "$SDK" || true
          ls "$SDK/licenses"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --version || true
          else
            echo "sdkmanager در PATH نیست — از SDK از پیش نصب‌شده استفاده می‌شود"
          fi
          java -version
          go version

      # ۶) cache ماژول‌های Go
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ env.GO_VERSION }}-${{ github.run_id }}
          restore-keys: go-${{ env.GO_VERSION }}-

      # ۷) ساخت هستهٔ واقعی VPN (libbox.aar) از سورس sing-box
      - name: Build libbox.aar from sing-box source
        run: |
          set -eux
          git clone --depth 1 --branch "$SING_BOX_REF" https://github.com/SagerNet/sing-box sb
          cd sb
          make lib_install                      # نصب gomobile + gobind
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android                      # خروجی: libbox.aar و libbox-legacy.aar
          ls -la libbox*.aar
          ls -la ../sing-box-for-android/app/libs

      # ۸) کلید امضا (اگر Secret نگذاشته باشی، کلید آزمایشی ساخته می‌شود)
      - name: Prepare signing key
        env:
          K_B64: ${{ secrets.KEYSTORE_BASE64 }}
          K_PASS: ${{ secrets.KEYSTORE_PASS }}
          K_ALIAS: ${{ secrets.ALIAS_NAME }}
          K_ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -eux
          KS=sing-box-for-android/app/release.keystore
          PASS="${K_PASS:-vpnmaster2026}"
          ALIAS="${K_ALIAS:-vpnmaster}"
          APASS="${K_ALIAS_PASS:-$PASS}"
          if [ -n "${K_B64:-}" ]; then
            echo "$K_B64" | base64 -d > "$KS"
          else
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -storepass "$PASS" -keypass "$APASS" -keyalg RSA -keysize 4096 -validity 10950 \
              -dname "CN=VPN Master, O=VPN Master, C=IR"
          fi
          printf 'KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n' "$PASS" "$ALIAS" "$APASS" > local.properties
          echo "LOCAL_PROPERTIES=$(base64 -w0 local.properties)" >> "$GITHUB_ENV"

      # ۹) کامپایل اپ
      - name: Build APK (assembleOtherRelease)
        working-directory: sing-box-for-android
        run: |
          set -eux
          chmod +x gradlew
          echo "android.builder.sdkDownload=true" >> gradle.properties
          ./gradlew --no-daemon --stacktrace --warning-mode=summary :app:assembleOtherRelease

      # ۱۰) بررسی امضا + خلاصه در صفحهٔ اجرا
      - name: Verify & summarize
        run: |
          set -eux
          APKDIR=sing-box-for-android/app/build/outputs/apk/other/release
          ls -la "$APKDIR"
          BT=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          for f in "$APKDIR"/*.apk; do
            echo "--- $f"
            [ -n "$BT" ] && "$BT/apksigner" verify --print-certs "$f" || true
          done
          {
            echo "### ✅ APK ساخته شد"
            echo ""
            echo "| فایل | حجم |"
            echo "|---|---|"
            for f in "$APKDIR"/*.apk; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
            echo ""
            echo "🔸 برای بیشتر گوشی‌ها \`arm64-v8a\` (یا \`universal\`) را نصب کن."
          } >> "$GITHUB_STEP_SUMMARY"

      # ۱۱) آپلود خروجی
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPNMaster-APK
          path: sing-box-for-android/app/build/outputs/apk/other/release/*.apk
          if-no-files-found: error
          retention-days: 90
