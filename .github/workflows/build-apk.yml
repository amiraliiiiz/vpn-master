name: Build VPN Master APK

# ساخت APK امضاشده در فضای ابری گیت‌هاب — نیازی به نصب چیزی روی کامپیوتر نیست.
# اجرا: تب Actions → Build VPN Master APK → Run workflow
#
# این Workflow دقیقاً از همان زنجیرهٔ ابزار CI رسمی sing-box استفاده می‌کند:
#   Go 1.26.10 · NDK r28 · JDK 17 · Gradle Wrapper خودِ پروژه

on:
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: "ref سورس sing-box برای ساخت هستهٔ libbox (testing / stable / v1.14.4)"
        required: false
        default: "testing"
  push:
    branches: ["main", "master"]

env:
  GO_VERSION: "1.26.10"
  SING_BOX_REF: ${{ github.event.inputs.sing_box_ref || 'testing' }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      # ۱) سورس اپ. پوشهٔ checkout عمداً «sing-box-for-android» نامیده شده،
      #    چون ابزار ساخت libbox خروجی AAR را خودش در ../sing-box-for-android/app/libs کپی می‌کند.
      - name: Checkout VPN Master
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Prepare libs dir
        run: mkdir -p sing-box-for-android/app/libs

      # ۲) ابزارها — همان نسخه‌هایی که خود sing-box در CI استفاده می‌کند
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Set up Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept licenses & env
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          java -version
          go version

      # ۳) cache ماژول‌های Go — اجراهای بعدی چند دقیقه سریع‌تر
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ env.GO_VERSION }}-${{ github.run_id }}
          restore-keys: go-${{ env.GO_VERSION }}-

      # ۴) ساخت هستهٔ واقعی VPN (libbox.aar) از سورس sing-box
      - name: Build libbox.aar from sing-box source
        run: |
          set -eux
          git clone --depth 1 --branch "$SING_BOX_REF" https://github.com/SagerNet/sing-box sb
          cd sb
          make lib_install                      # نصب gomobile + gobind
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android                      # خروجی: libbox.aar و libbox-legacy.aar (۴ معماری)
          ls -la libbox*.aar
          ls -la ../sing-box-for-android/app/libs

      # ۵) کلید امضا — اگر Secret نگذاشته باشی، کلید آزمایشی ساخته می‌شود
      - name: Prepare signing key
        env:
          K_B64: ${{ secrets.KEYSTORE_BASE64 }}
          K_PASS: ${{ secrets.KEYSTORE_PASS }}
          K_ALIAS: ${{ secrets.ALIAS_NAME }}
          K_ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -eux
          KS=sing-box-for-android/app/release.keystore
          PASS="${K_PASS:-vpnmaster2026}"
          ALIAS="${K_ALIAS:-vpnmaster}"
          APASS="${K_ALIAS_PASS:-$PASS}"
          if [ -n "${K_B64:-}" ]; then
            echo "$K_B64" | base64 -d > "$KS"
            echo "استفاده از کلید موجود در Secrets"
          else
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -storepass "$PASS" -keypass "$APASS" -keyalg RSA -keysize 4096 -validity 10950 \
              -dname "CN=VPN Master, O=VPN Master, C=IR"
          fi
          printf 'KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n' "$PASS" "$ALIAS" "$APASS" > local.properties
          echo "LOCAL_PROPERTIES=$(base64 -w0 local.properties)" >> "$GITHUB_ENV"

      # ۶) کامپایل اپ
      - name: Build APK (assembleOtherRelease)
        working-directory: sing-box-for-android
        run: |
          set -eux
          chmod +x gradlew
          echo "android.builder.sdkDownload=true" >> gradle.properties
          ./gradlew --no-daemon --stacktrace --warning-mode=summary :app:assembleOtherRelease

      # ۷) بررسی امضا + خلاصه در صفحهٔ اجرا
      - name: Verify & summarize
        run: |
          set -eux
          APKDIR=sing-box-for-android/app/build/outputs/apk/other/release
          ls -la "$APKDIR"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          for f in "$APKDIR"/*.apk; do
            echo "--- $f"
            [ -n "$BT" ] && "$BT/apksigner" verify --print-certs "$f" || true
          done
          {
            echo "### ✅ APK ساخته شد"
            echo ""
            echo "| فایل | حجم |"
            echo "|---|---|"
            for f in "$APKDIR"/*.apk; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
            echo ""
            echo "🔸 برای بیشتر گوشی‌ها \`arm64-v8a\` (یا \`universal\`) را نصب کن."
          } >> "$GITHUB_STEP_SUMMARY"

      # ۸) آپلود خروجی
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPNMaster-APK
          path: sing-box-for-android/app/build/outputs/apk/other/release/*.apk
          if-no-files-found: error
          retention-days: 90
